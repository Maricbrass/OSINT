<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-body">
                        <h1 class="card-title text-center mb-4">OSINT Search Dashboard</h1>
                        <p class="text-center mb-4">Search through collected OSINT data from various platforms.</p>
                        <form action="/search" method="get" class="mb-4" onsubmit="showLoading()">
                            <div class="input-group">
                                <input type="text" name="q" class="form-control" placeholder="Enter search term..." required>
                                <button class="btn btn-primary" type="submit" id="searchBtn">
                                    <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                                    Search
                                </button>
                            </div>
                        </form>
                        <div class="text-center">
                            <a href="/database" class="btn btn-info me-2">View Database</a>
                            <a href="/charts" class="btn btn-warning">View Charts</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function showLoading() {
            const btn = document.getElementById('searchBtn');
            const spinner = btn.querySelector('.spinner-border');
            spinner.classList.remove('d-none');
            btn.disabled = true;
        }
    </script>
</body>
</html>
